name: Windows executable release
on:
  push:
    branches: [codex/minimap-observation]
    paths: ['pc/**', 'assets/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r pc/requirements.txt pyinstaller==6.16.0 pytest
          if ($LASTEXITCODE) { throw 'Python dependencies failed' }
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { throw 'Tesseract install failed' }
      - name: Prepare verified OCR models
        run: python pc/packaging/prepare_assets.py
      - name: Tests
        run: python -m pytest pc/tests -q
      - name: Build single EXE; verify isolated UI and bundled OCR
        shell: pwsh
        run: pc/packaging/build_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kkullim-PC-Windows-x64
          path: pc/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-check
          path: pc/ui-check/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pc-packet-observe-build.${{ github.run_number }}"
          @'
          Read-only packet diagnostics preview based on PC v0.10, not local v0.14.4/v0.14.5. Download Kkullim-PC-0.10.4-packet-observe.exe. The fourth tab records only actual game-PID TCP connections involving port16000 via existing Npcap, nonpromiscuously. It stops after60seconds/12MiB, on user stop or connection change. Manually export PCAP+metadata ZIP for analysis; no automatic upload, packet sending, reinjection or Mobilay settings changes. Current-game coordinates/IDs/mechanics are not decoded or verified. All game input stays disabled. The old OCR tab remains experimental (fire fixture only; lightning unsupported). Windows unit tests and isolated single-EXE checks cover four UI tabs, bundled OCR and simulated passive packet recording/PCAP export; actual user-PC Npcap reception remains unverified. F8 starts/stops the selected mode; F9 stops it.
          '@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag pc/release/* --prerelease --latest=false --target '${{ github.sha }}' --title "Kkullim PC passive packet preview (build ${{ github.run_number }})" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Release publication failed' }
