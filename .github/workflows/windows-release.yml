name: Windows executable release
on:
  push:
    branches: [codex/fishing-windows-release, main]
    paths: ['pc/**', 'assets/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r pc/requirements.txt pyinstaller==6.16.0 pytest
          if ($LASTEXITCODE) { throw 'Python dependencies failed' }
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { throw 'Tesseract install failed' }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -notin 0, 3010) { throw 'Inno Setup install failed' }
          }
      - name: Tests
        run: python -m pytest pc/tests -q
      - name: Build portable ZIP and installer; verify packaged UI
        shell: pwsh
        run: pc/packaging/build_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kkullim-PC-Windows-x64
          path: pc/release/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pc-v0.10.0-build.${{ github.run_number }}"
          @'
          Windows x64 executable distribution. Download the Setup EXE, or extract the complete portable ZIP and run Kkullim.exe. Python and OCR runtime are included. Both UI tabs were initialized by a packaged smoke test; actual game input needs validation. The low-quality cancel key must be checked in-game.
          '@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag pc/release/* --target '${{ github.sha }}' --title "Kkullim PC 0.10.0 (build ${{ github.run_number }})" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Release publication failed' }
