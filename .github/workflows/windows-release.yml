name: Windows executable release
on:
  push:
    branches: [codex/minimap-observation]
    paths: ['pc/**', 'assets/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r pc/requirements.txt pyinstaller==6.16.0 pytest
          if ($LASTEXITCODE) { throw 'Python dependencies failed' }
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { throw 'Tesseract install failed' }
      - name: Tests
        run: python -m pytest pc/tests -q
      - name: Build single EXE; verify isolated UI and bundled OCR
        shell: pwsh
        run: pc/packaging/build_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kkullim-PC-Windows-x64
          path: pc/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-check
          path: pc/ui-check/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pc-minimap-observe-build.${{ github.run_number }}"
          @'
          Observation preview based on PC v0.10, not the local v0.14.4/v0.14.5 sources. Download Kkullim-PC-0.10.1-minimap-observe.exe. The third tab observes the EntityMap window or a screenshot without game input. Spear answer labels, bingo grids and star/X candidates are experimental. Real screenshots and live game accuracy remain unvalidated; O detection, movement and mechanic completion are not implemented. The existing abyss/fishing tabs can send game input when explicitly started. All three UI tabs and bundled Korean OCR are smoke-tested in isolation. No separate Python or OCR installation is required.
          '@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag pc/release/* --prerelease --latest=false --target '${{ github.sha }}' --title "Kkullim PC minimap observation preview (build ${{ github.run_number }})" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Release publication failed' }
