name: Windows executable release
on:
  push:
    branches: [codex/minimap-observation]
    paths: ['pc/**', 'assets/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r pc/requirements.txt pyinstaller==6.16.0 pytest
          if ($LASTEXITCODE) { throw 'Python dependencies failed' }
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { throw 'Tesseract install failed' }
      - name: Prepare verified OCR models
        run: python pc/packaging/prepare_assets.py
      - name: Tests
        run: python -m pytest pc/tests -q
      - name: Build single EXE; verify isolated UI and bundled OCR
        shell: pwsh
        run: pc/packaging/build_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kkullim-PC-Windows-x64
          path: pc/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-check
          path: pc/ui-check/*
          if-no-files-found: error
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pc-packet-inspect-build.${{ github.run_number }}"
          @'
          Read-only packet inspection preview based on PC v0.10, not local v0.14.4/v0.14.5. Download Kkullim-PC-0.10.5-packet-inspect.exe. Adds bounded TCP reassembly, version-specific position/spear-boss candidates, ZIP replay and JSON export. Real private capture replay matches independent analysis:1216serverframes,81clientframes,265positionrecords,2bosscandidaterecords;2unknowncompressedmessages remain opaque. This does not verify self identity, element, target, departure signal or mechanic success. No game input is sent. Optional timestamped evidence captures only the existing unobscured coordinate window, bounded to30images/8MiB; player labels may appear. Records exact game-PID TCP16000 connections via existing Npcap for60seconds/12MiB, stopping on connection change. No automatic upload or Mobilay changes. Isolated EXE tests bundled OCR/Brotli, synthetic capture, TCP framing, evidence timing and replay/export ZIP. Actual new live reception/evidence capture is still to be tested on the user PC. F8 starts/stops; F9 stops.
          '@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag pc/release/* --prerelease --latest=false --target '${{ github.sha }}' --title "Kkullim PC packet inspection preview (build ${{ github.run_number }})" --notes-file release-notes.txt
          if ($LASTEXITCODE) { throw 'Release publication failed' }
